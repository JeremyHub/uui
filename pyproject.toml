[project]
name = "uui"
version = "0.1.0"
description = "UUI: FastAPI backend that streams live-generated HTML from a local Ollama model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[dependency-groups]
# scripts/e2e.py drives the real frontend in Chrome; uses the system browser
# (channel="chrome"), so no `playwright install` download is needed.
dev = ["playwright"]

[tool.uv]
package = false
