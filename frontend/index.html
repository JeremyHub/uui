<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UUI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif; color: #222;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #topbar, #bootstrap, #status { flex: 0 0 auto; padding: 8px 16px; box-sizing: border-box; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0; }
  #topbar h3 { margin: 8px 0; }
  #topbar button { font-size: 12px; }
  #bootstrap { display: flex; gap: 8px; }
  #bootstrap input { flex: 1; padding: 8px; font-size: 14px; }
  #bootstrap button { padding: 8px 16px; }
  #status { font-size: 12px; color: #888; min-height: 16px; padding-top: 0; padding-bottom: 0; }
  #app { flex: 1 1 auto; min-height: 0; overflow: auto; border-top: 1px solid #ddd; }
  details { flex: 0 0 auto; font-size: 12px; padding: 4px 16px; }
  #transcript { background: #f6f6f6; padding: 8px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="topbar">
  <h3>UUI</h3>
  <button id="reset-btn">reset</button>
</div>

<div id="bootstrap">
  <input id="concept" placeholder="What should this app be? e.g. 'a number guessing game'">
  <button id="start-btn">Start</button>
</div>

<div id="status"></div>
<div id="app"></div>

<details>
  <summary>transcript (debug)</summary>
  <div id="transcript"></div>
</details>

<script>
  let currentHtml = "";              // exactly what's on screen right now
  const actions = [];                // full event log, in-memory only
  const appEl = document.getElementById("app");
  const statusEl = document.getElementById("status");
  const transcriptEl = document.getElementById("transcript");
  const bootstrapEl = document.getElementById("bootstrap");

  function renderTranscript() {
    transcriptEl.textContent = JSON.stringify({ currentHtml, actions }, null, 2);
  }

  // <script> tags set via innerHTML are inert -- recreate them so they actually run.
  function executeScripts(container) {
    container.querySelectorAll("script").forEach((oldScript) => {
      const newScript = document.createElement("script");
      for (const attr of oldScript.attributes) {
        newScript.setAttribute(attr.name, attr.value);
      }
      newScript.textContent = oldScript.textContent;
      oldScript.replaceWith(newScript);
    });
  }

  async function sendTurn(event) {
    actions.push(event);
    renderTranscript();
    statusEl.textContent = "generating...";

    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_html: currentHtml, actions }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let acc = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      acc += decoder.decode(value, { stream: true });
      statusEl.textContent = `generating... (${acc.length} chars)`;
    }

    // Swap the DOM only once the fragment is complete -- partial HTML mid-tag
    // isn't valid to inject incrementally.
    currentHtml = acc;
    appEl.innerHTML = acc;               // NOTE: intentionally unsanitized, by design
    executeScripts(appEl);
    // Generated scripts sometimes wait for DOMContentLoaded/load out of habit, even though
    // those already fired -- re-dispatch synthetic copies so such listeners still run.
    document.dispatchEvent(new Event("DOMContentLoaded"));
    window.dispatchEvent(new Event("load"));
    renderTranscript();
    statusEl.textContent = "";
  }

  document.getElementById("start-btn").addEventListener("click", () => {
    const concept = document.getElementById("concept").value.trim() || "a simple demo app";
    bootstrapEl.style.display = "none";
    sendTurn({ event: "start", concept });
  });

  document.getElementById("reset-btn").addEventListener("click", () => location.reload());

  // Deterministically read every form control's real state -- checkboxes/radios need
  // .checked, not .value (which stays truthy even when unchecked).
  function collectFormState(container) {
    const state = {};
    container.querySelectorAll("input, select, textarea").forEach((field) => {
      const key = field.name || field.id;
      if (!key) return;
      if (field.type === "checkbox") {
        state[key] = field.checked;
      } else if (field.type === "radio") {
        if (field.checked) state[key] = field.value;
        else if (!(key in state)) state[key] = null;
      } else if (field.tagName === "SELECT" && field.multiple) {
        state[key] = Array.from(field.selectedOptions).map((o) => o.value);
      } else {
        state[key] = field.value;
      }
    });
    return state;
  }

  // Event delegation: any element with data-action, or any real <a href>, inside #app
  // drives the next turn. Real links are intercepted rather than constrained -- the model
  // can write authentic-looking hrefs freely; clicking one never actually navigates, it just
  // asks the model to generate whatever should come next.
  appEl.addEventListener("click", (e) => {
    const link = e.target.closest("a[href]");
    const actionEl = e.target.closest("[data-action]");
    const el = actionEl || link;
    if (!el || !appEl.contains(el)) return;
    e.preventDefault();

    const action = el.dataset.action || "navigate";
    const elementData = {};
    for (const [k, v] of Object.entries(el.dataset)) {
      if (k !== "action") elementData[k] = v;
    }
    if (link) {
      elementData.href = elementData.href || link.getAttribute("href");
      elementData.linkText = elementData.linkText || link.textContent.trim();
    }

    const formValues = collectFormState(appEl);

    sendTurn({ event: "click", action, elementData, formValues });
  });

  // Catch form submissions too -- including Enter-key submits, which never fire a click on
  // any button at all and would otherwise bypass the delegation above entirely.
  appEl.addEventListener("submit", (e) => {
    const form = e.target.closest("form");
    if (!form || !appEl.contains(form)) return;
    e.preventDefault();

    const action = form.dataset.action || "submit";
    const elementData = {};
    for (const [k, v] of Object.entries(form.dataset)) {
      if (k !== "action") elementData[k] = v;
    }

    const formValues = collectFormState(appEl);

    sendTurn({ event: "submit", action, elementData, formValues });
  });
</script>

</body>
</html>
