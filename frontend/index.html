<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UUI</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="topbar">
  <h3>UUI</h3>
  <select id="engine" title="Where the model runs"></select>
  <select id="model" title="Which model"></select>
  <span class="spacer"></span>
  <label><input type="checkbox" id="speculate"> predict next click</label>
  <button id="reset-btn">reset</button>
</div>

<div id="bootstrap">
  <input id="concept" placeholder="What would you like to see? e.g. 'a blog about cats'">
  <button id="start-btn">Show me</button>
</div>

<div id="status"></div>

<div id="stage">
  <iframe id="app" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  <div id="loading" hidden>
    <div class="card">
      <h2 id="loading-title">Working</h2>
      <p id="loading-detail"></p>
      <div class="bar indeterminate" id="loading-bar"><span></span></div>
    </div>
  </div>
</div>

<details>
  <summary>transcript (debug)</summary>
  <div id="transcript"></div>
</details>

<script type="module" src="main.js"></script>
</body>
</html>
