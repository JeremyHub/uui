<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UUI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif; color: #222;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #topbar, #bootstrap, #status { flex: 0 0 auto; padding: 8px 16px; box-sizing: border-box; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0; }
  #topbar h3 { margin: 8px 0; }
  #topbar button { font-size: 12px; }
  #bootstrap { display: flex; gap: 8px; }
  #bootstrap input { flex: 1; padding: 8px; font-size: 14px; }
  #bootstrap button { padding: 8px 16px; }
  #status { font-size: 12px; color: #888; min-height: 16px; padding-top: 0; padding-bottom: 0; }
  #app { flex: 1 1 auto; min-height: 0; display: block; width: 100%; border: 0; border-top: 1px solid #ddd; }
  details { flex: 0 0 auto; font-size: 12px; padding: 4px 16px; }
  #transcript { background: #f6f6f6; padding: 8px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="topbar">
  <h3>UUI</h3>
  <button id="reset-btn">reset</button>
</div>

<div id="bootstrap">
  <input id="concept" placeholder="What should this app be? e.g. 'a number guessing game'">
  <button id="start-btn">Start</button>
</div>

<div id="status"></div>
<iframe id="app" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

<details>
  <summary>transcript (debug)</summary>
  <div id="transcript"></div>
</details>

<script>
  let currentHtml = "";              // exactly what's on screen right now
  let lastSummary = "";              // prose description of currentHtml, from the summary phase
  const actions = [];                // full event log, in-memory only
  const appEl = document.getElementById("app");
  const statusEl = document.getElementById("status");
  const transcriptEl = document.getElementById("transcript");
  const bootstrapEl = document.getElementById("bootstrap");

  function renderTranscript() {
    transcriptEl.textContent = JSON.stringify({ currentHtml, lastSummary, actions }, null, 2);
  }

  // Backend runs four phases per turn: "intent" (given the last summary, the raw current
  // HTML, and the action just taken, describe what the user was trying to do), "plan"
  // (given the last summary and that intent, decide what happens next), "html" (implement
  // that plan), then "summary" (describe what the html phase actually produced, in prose,
  // so next turn's intent/plan phases read that instead of the raw HTML -- otherwise
  // planning tends to treat old markup as something to preserve rather than a screen it's
  // free to fully replace). All four stream as NDJSON lines.
  async function sendTurn(event) {
    actions.push(event);
    renderTranscript();
    statusEl.textContent = "interpreting...";

    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_html: currentHtml, summary: lastSummary, actions }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let nl;
      while ((nl = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, nl);
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);

        if (msg.phase === "intent" && !msg.done) {
          statusEl.textContent = `interpreting... (${msg.chars} chars)`;
        } else if (msg.phase === "intent" && msg.done) {
          event.intent = msg.text;         // recorded on the timeline entry for the transcript
          renderTranscript();
          statusEl.textContent = "planning...";
        } else if (msg.phase === "plan" && !msg.done) {
          statusEl.textContent = `planning... (${msg.chars} chars)`;
        } else if (msg.phase === "plan" && msg.done) {
          event.plan = msg.text;           // recorded on the timeline entry for the transcript
          renderTranscript();
          statusEl.textContent = "generating...";
        } else if (msg.phase === "html" && !msg.done) {
          statusEl.textContent = `generating... (${msg.chars} chars)`;
        } else if (msg.phase === "html" && msg.done) {
          // Swap the iframe as soon as the document is complete -- don't make the user
          // wait through the summary phase too before seeing the new screen.
          currentHtml = msg.text;
          appEl.srcdoc = currentHtml;   // NOTE: intentionally unsanitized, by design
          renderTranscript();
          statusEl.textContent = "summarizing...";
        } else if (msg.phase === "summary" && !msg.done) {
          statusEl.textContent = `summarizing... (${msg.chars} chars)`;
        } else if (msg.phase === "summary" && msg.done) {
          lastSummary = msg.text;
          event.summary = msg.text;        // recorded on the timeline entry for the transcript
          renderTranscript();
          statusEl.textContent = "";
        } else if (msg.phase === "error") {
          currentHtml = `<!doctype html><html><body><pre style="color:red; white-space:pre-wrap;">${msg.message}</pre></body></html>`;
          appEl.srcdoc = currentHtml;
          renderTranscript();
          statusEl.textContent = "";
        }
      }
    }
  }

  function startFromConcept() {
    const concept = document.getElementById("concept").value.trim() || "a simple demo app";
    bootstrapEl.style.display = "none";
    sendTurn({ event: "start", concept });
  }

  document.getElementById("start-btn").addEventListener("click", startFromConcept);
  document.getElementById("concept").addEventListener("keydown", (e) => {
    if (e.key === "Enter") startFromConcept();
  });

  document.getElementById("reset-btn").addEventListener("click", () => location.reload());

  // Deterministically read every form control's real state -- checkboxes/radios need
  // .checked, not .value (which stays truthy even when unchecked). Also picks up
  // aria-pressed toggle buttons, since a toggle-style button (e.g. a "liked" state, an
  // active filter chip) has nowhere else to keep its on/off state across a hop.
  function collectFormState(container) {
    const state = {};
    container.querySelectorAll("input, select, textarea").forEach((field) => {
      const key = field.name || field.id;
      if (!key) return;
      if (field.type === "checkbox") {
        state[key] = field.checked;
      } else if (field.type === "radio") {
        if (field.checked) state[key] = field.value;
        else if (!(key in state)) state[key] = null;
      } else if (field.tagName === "SELECT" && field.multiple) {
        state[key] = Array.from(field.selectedOptions).map((o) => o.value);
      } else {
        state[key] = field.value;
      }
    });
    container.querySelectorAll("[aria-pressed]").forEach((el) => {
      const key = el.name || el.id;
      if (!key) return;
      state[key] = el.getAttribute("aria-pressed") === "true";
    });
    return state;
  }

  // Describes whatever the user actually interacted with, generically -- no special
  // attribute (like a data-action name) is required from the generated page. Tag, visible
  // text, and real attributes give the intent phase enough to figure out what happened. Any
  // data-* attributes the model did add still pass through as bonus context.
  function describeElement(el) {
    const data = { ...el.dataset };
    return {
      tag: el.tagName.toLowerCase(),
      text: el.textContent.trim().slice(0, 200),
      id: el.id || undefined,
      name: el.name || undefined,
      className: el.className || undefined,
      href: el.tagName === "A" ? el.getAttribute("href") : undefined,
      type: el.type || undefined,
      ...(Object.keys(data).length ? { data } : {}),
    };
  }

  // Event delegation: deterministically captures clicks on every real interactive control
  // (button, link, submit/button/reset input, role=button) inside the iframe's document --
  // no matter what the model generated it as, no special markup required. Real links are
  // intercepted rather than constrained -- the model can write authentic-looking hrefs
  // freely; clicking one never actually navigates, it just asks the model to generate
  // whatever should come next.
  function attachDelegation(doc) {
    // Capture phase + stopImmediatePropagation: generated documents sometimes attach their
    // own listeners directly on the clicked element (e.g. real webpages tend to wire up
    // window.location-driven "navigation" despite being told not to) -- those run before a
    // bubble-phase listener ever would. Intercepting in the capture phase guarantees we see
    // the event first and can kill it before any such handler executes.
    doc.addEventListener(
      "click",
      (e) => {
        const el = e.target.closest(
          'button, a[href], input[type="submit"], input[type="button"], input[type="reset"], [role="button"]'
        );
        if (!el) return;
        e.preventDefault();
        e.stopImmediatePropagation();

        const elementData = describeElement(el);
        const formValues = collectFormState(doc);

        sendTurn({ event: "click", elementData, formValues });
      },
      true
    );

    // Catch form submissions too -- including Enter-key submits, which never fire a click
    // on any button at all and would otherwise bypass the delegation above entirely.
    // e.submitter is the specific button that triggered the submit (or the form itself, for
    // an implicit Enter-key submit with no button focused).
    doc.addEventListener(
      "submit",
      (e) => {
        const form = e.target.closest("form");
        if (!form) return;
        e.preventDefault();
        e.stopImmediatePropagation();

        const elementData = describeElement(e.submitter || form);
        const formValues = collectFormState(doc);

        sendTurn({ event: "submit", elementData, formValues });
      },
      true
    );
  }

  // The iframe gets a whole new document every time we set srcdoc, so delegation has to be
  // re-attached each time -- but waiting for the iframe's "load" event isn't good enough: it
  // only fires once every resource (including the real external images the model is told to
  // link) has finished loading, while the DOM is clickable much sooner. That leaves a window
  // where a click can reach the browser's native, unintercepted handling -- e.g. a real link
  // actually navigating away. Poll readyState instead so delegation attaches the moment the
  // new document exists and is parsed, not once its images happen to finish.
  let attachedDoc = null;
  setInterval(() => {
    const doc = appEl.contentDocument;
    if (!doc || doc === attachedDoc || doc.readyState === "loading") return;
    attachedDoc = doc;
    attachDelegation(doc);
  }, 20);
</script>

</body>
</html>
